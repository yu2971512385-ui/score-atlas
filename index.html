<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5b7c9">
  <meta name="color-scheme" content="light">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="按乐器、作曲家与作品浏览开放曲谱，并在本机将旋律或授权音频转为不同乐器谱。">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=5.3.2">
  <link rel="stylesheet" href="kirby-theme.css?v=5.3.2">
  <title>谱典 · 古典音乐人物与曲谱</title>
</head>
<body>
  <a class="skip-link" href="#app">跳到主内容</a>
  <div class="boot-loader" id="boot-loader" role="status" aria-label="正在打开曲谱库">
    <div class="boot-kirby-card">
      <div class="boot-kirby-frame"><img class="boot-kirby-image" id="boot-kirby-image" alt="随机出现的卡比"></div>
      <div class="boot-kirby-copy"><strong>正在打开谱典</strong><span>人物、作品与曲谱正在就位</span></div>
    </div>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#/" aria-label="谱典首页">
        <span class="brand-mark" aria-hidden="true">谱</span>
        <span>
          <strong>谱典</strong>
          <small>Score Atlas</small>
        </span>
      </a>

      <form class="header-search" id="header-search" role="search">
        <i data-lucide="search" aria-hidden="true"></i>
        <input id="header-search-input" name="q" type="search" autocomplete="off" placeholder="搜作曲家、作品、作品号…" aria-label="搜索曲谱资料库">
        <button class="icon-button clear-search" type="button" aria-label="清除搜索" title="清除搜索" hidden>
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </form>

      <nav class="desktop-nav" aria-label="主导航">
        <a href="#/instruments">分类</a>
        <a href="#/people">人物</a>
        <a href="#/arranger">智能转谱</a>
        <a href="#/favorites">收藏</a>
        <a class="icon-button" href="#/about" aria-label="资料与版权说明" title="资料与版权说明">
          <i data-lucide="info" aria-hidden="true"></i>
        </a>
      </nav>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <nav class="mobile-nav" aria-label="手机导航">
    <a href="#/" data-nav="home"><i data-lucide="house" aria-hidden="true"></i><span>首页</span></a>
    <a href="#/instruments" data-nav="instruments"><i data-lucide="library" aria-hidden="true"></i><span>分类</span></a>
    <a href="#/search" data-nav="search"><i data-lucide="search" aria-hidden="true"></i><span>搜索</span></a>
    <a href="#/arranger" data-nav="arranger"><i data-lucide="wand-sparkles" aria-hidden="true"></i><span>转谱</span></a>
    <a href="#/favorites" data-nav="favorites"><i data-lucide="bookmark" aria-hidden="true"></i><span>收藏</span></a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>请开启 JavaScript 以浏览、搜索和收藏曲谱。</noscript>
  <script src="kirby-theme.js?v=5.3.2"></script>
  <script src="assets/lucide.min.js"></script>
  <script src="assets/abcjs-basic-min.js?v=5.3.2"></script>
  <script src="data.js?v=5.3.2"></script>
  <script src="tunes.js?v=5.3.2"></script>
  <script src="audio-transcriber.js?v=5.3.2"></script>
  <script src="arranger.js?v=5.3.2"></script>
  <script src="app.js?v=5.3.2"></script>
</body>
</html>
